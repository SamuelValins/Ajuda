<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda Solidária - Exame Médico</title>
    <style>
        :root { --primary: #00ff88; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .container { background: var(--card); padding: 30px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .progress-bg { background: #333; height: 20px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.5s; }
        .pix-box { background: #2a2a2a; border-left: 4px solid var(--primary); padding: 15px; margin: 20px 0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: black; margin-top: 10px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pix-info { font-size: 0.9em; color: #ccc; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Juntos pela Val, solidariedade transforma vidas!</h2>
    <p>Precisamos arrecadar <strong>R$ 1.700,00</strong> para o exame de ressonância.</p>
    
    <div class="progress-bg"><div id="barra" class="progress-bar"></div></div>
    <p id="status-texto">Carregando arrecadação...</p>

    <div class="pix-box">
        <p>Chave PIX (Bradesco):</p>
        <strong style="font-size: 1.2em;">26048764855</strong>
        <div class="pix-info">Valdirene Caetano Sobrinho Ferraz</div>
    </div>

    <form id="formDoacao">
        <input type="text" id="nomeDoador" placeholder="Nome do Doador" required>
        <input type="number" id="valorDoado" placeholder="Valor doado (R$)" required>
        <label style="font-size: 0.8em; color: #aaa;">Anexar comprovante:</label>
        <input type="file" id="arquivoComprovante" accept="image/*" required>
        <button type="submit" id="btnSubmit">Enviar Doação</button>
    </form>
</div>

<script>
    // --- SUAS SAS TOKENS ---
    const SAS_BLOB = "?sv=2026-02-06&ss=bt&srt=sco&sp=rwact&se=2027-01-19T21:24:32Z&st=2026-11-19T13:09:32Z&spr=https&sig=F8Q3bE8yLQQPoQxyk%2B6v7iDEi%2BkBQ68HuoHUawTwaJA%3D";
    const SAS_TABLE = "?sv=2026-02-06&ss=bt&srt=sco&sp=rwact&se=2027-01-19T21:24:32Z&st=2026-11-19T13:09:32Z&spr=https&sig=F8Q3bE8yLQQPoQxyk%2B6v7iDEi%2BkBQ68HuoHUawTwaJA%3D";
    
    const meta = 1700;

    // --- FUNÇÃO PARA BUSCAR E SOMAR VALORES ---
    async function atualizarTotal() {
        try {
            // Buscando na tabela 'doacoes'
            const response = await fetch(`https://dashboardclarobrasil.table.core.windows.net/doacoes()${SAS_TABLE}`, {
                method: 'GET',
                headers: { 'Accept': 'application/json;odata=nometadata' }
            });
            
            const data = await response.json();
            
            let total = 0;
            const lista = data.value || data; // Captura o array de doações
            
            if (Array.isArray(lista)) {
                lista.forEach(item => {
                    total += parseFloat(item.Valor || 0);
                });
            }

            const porcentagem = (total / meta) * 100;
            document.getElementById('barra').style.width = Math.min(porcentagem, 100) + '%';
            document.getElementById('status-texto').innerText = 
                `Arrecadado: R$ ${total.toFixed(2)} de R$ ${meta.toFixed(2)} (${porcentagem.toFixed(0)}%)`;
        } catch (err) {
            console.error("Erro ao carregar total:", err);
            document.getElementById('status-texto').innerText = "Erro ao buscar dados.";
        }
    }

    // --- ENVIO DO FORMULÁRIO ---
    document.getElementById('formDoacao').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nome = document.getElementById('nomeDoador').value;
        const valor = document.getElementById('valorDoado').value;
        const arquivo = document.getElementById('arquivoComprovante').files[0];
        const btn = document.getElementById('btnSubmit');

        btn.disabled = true;
        btn.innerText = "Enviando...";

        try {
            // 1. Upload da Foto
            const nomeArquivo = `${Date.now()}_${nome.replace(/\s+/g, '')}.jpg`;
            const blobUrl = `https://dashboardclarobrasil.blob.core.windows.net/comprovantes/${nomeArquivo}${SAS_BLOB}`;
            
            await fetch(blobUrl, {
                method: 'PUT',
                headers: { 'x-ms-blob-type': 'BlockBlob', 'Content-Type': arquivo.type },
                body: arquivo
            });

            // 2. Registro na Tabela 'doacoes'
            const tableUrl = `https://dashboardclarobrasil.table.core.windows.net/doacoes`;
            await fetch(tableUrl + SAS_TABLE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    PartitionKey: "doacoes",
                    RowKey: Date.now().toString(),
                    Nome: nome,
                    Valor: valor
                })
            });

            alert("Doação enviada com sucesso!");
            location.reload();
        } catch (err) {
            console.error(err);
            alert("Erro no envio! Verifique se o CORS está configurado no Azure para o seu site.");
            btn.disabled = false;
            btn.innerText = "Enviar Doação";
        }
    });

    // Iniciar ao carregar
    atualizarTotal();
</script>

</body>
</html>
